name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, as vX.Y.Z
        required: true
permissions:
  contents: read
env:
  VERSION: ${{ inputs.version }}
jobs:
  # Each architecture builds and checks its own images, then hands exactly those to publish
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: main and a new version
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run it from main, not $GITHUB_REF"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$VERSION is not vX.Y.Z"; exit 1; }
          if git ls-remote --exit-code origin "refs/tags/$VERSION"; then echo "$VERSION already exists"; exit 1; fi
      - run: bin/flights build
      - run: bin/flights test
      # Without the filter checks, which test Google; once more after a pause, since Google limits shared runner IPs
      - name: flights selftest
        run: |
          bin/flights links &
          bin/flights selftest --no-filters || { sleep 120; bin/flights selftest --no-filters; }
      - name: the checked images
        run: docker save $(bin/flights images) | gzip -1 > "images-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.arch }}
          path: images-${{ matrix.arch }}.tar.gz
          retention-days: 1
          if-no-files-found: error
  # Apart from check, which runs the repo's code and reaches the internet: only this job can write, and it runs
  # nothing from the repo, it only pushes the checked images and declares them by digest in images.json
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only to attach bin/release.py, the installer, to the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          merge-multiple: true
      - name: push the checked images and publish the release
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=${GITHUB_REPOSITORY_OWNER,,}
          declare -A arches
          for arch in amd64 arm64; do
            # Both architectures load under the same tags, so each is pushed before the next one loads
            for tag in $(gunzip -c "images-$arch.tar.gz" | docker load | sed -n 's/^Loaded image: //p'); do
              name=ghcr.io/$owner/${tag%%:*}
              docker tag "$tag" "$name:${tag#*:}-$arch"
              docker push -q "$name:${tag#*:}-$arch"
              # From the registry: on the containerd store the first repo digest docker lists is the local one
              digest=$(docker buildx imagetools inspect "$name:${tag#*:}-$arch" --format '{{json .Manifest}}' | jq -r .digest)
              arches[$tag]+=" $name@$digest"
              docker image rm "$tag" "$name:${tag#*:}-$arch"
            done
          done
          images='{}'
          for tag in "${!arches[@]}"; do
            name=ghcr.io/$owner/${tag%%:*}
            docker buildx imagetools create -t "$name:${tag#*:}" -t "$name:$VERSION" ${arches[$tag]}
            digest=$(docker buildx imagetools inspect "$name:${tag#*:}" --format '{{json .Manifest}}' | jq -r .digest)
            images=$(jq --arg tag "$tag" --arg ref "$name@$digest" '. + {($tag): $ref}' <<<"$images")
          done
          [ "$(jq length <<<"$images")" = 2 ] || { echo "expected 2 images, got $images"; exit 1; }
          jq -n --arg commit "$GITHUB_SHA" --argjson images "$images" '{commit: $commit, images: $images}' > images.json
          cat images.json
          gh release create "$VERSION" images.json bin/release.py --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
